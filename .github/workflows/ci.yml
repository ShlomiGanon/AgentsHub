name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_CORE_MODEL_PROVIDER: openai
      TEST_CORE_MODEL_NAME: test-core-model
      TEST_CORE_MODEL_API_KEY_ENV: CORE_TEST_KEY
      TEST_CORE_TEST_KEY: test-key
      TEST_SUB_MODEL_PROVIDER: openai
      TEST_SUB_MODEL_NAME: test-sub-model
      TEST_SUB_MODEL_API_KEY_ENV: SUB_TEST_KEY
      TEST_SUB_TEST_KEY: test-key

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full test suite
        run: python -m pytest -q
